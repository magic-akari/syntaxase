name: Build

on:
    workflow_call:
    workflow_dispatch:
    pull_request:
    push:
        branches: ["**"]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build npm packages
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  version: 2026.9.1
            - name: Build native packages
              run: mise run build:npm
            - name: Build WebAssembly package
              run: mise run build:wasm
            - name: Pack npm packages
              shell: bash
              run: |
                  mkdir -p dist
                  for package_dir in npm/syntaxase/@syntaxase/binding-*; do
                    npm pack "./${package_dir}" --pack-destination "$GITHUB_WORKSPACE/dist"
                  done
                  npm pack ./npm/syntaxase --pack-destination "$GITHUB_WORKSPACE/dist"
                  npm pack ./npm/syntaxase-wasm --pack-destination "$GITHUB_WORKSPACE/dist"
            - name: Upload npm packages
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: npm-packages
                  path: dist/*.tgz
                  if-no-files-found: error
                  overwrite: true
                  retention-days: 14

name: Release

on:
    push:
        tags: ["v*"]

permissions:
    contents: read

jobs:
    build:
        uses: ./.github/workflows/build.yml

    publish-npm:
        name: Publish to npm
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
              with:
                  version: 2026.8.10
                  install_args: node
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: npm-packages
                  path: dist
            - name: Publish packages
              shell: bash
              run: |
                  set -o pipefail

                  expected_version="${GITHUB_REF_NAME#v}"
                  dist_tag="latest"
                  if [[ "$expected_version" == *-* ]]; then
                    dist_tag="${expected_version#*-}"
                    dist_tag="${dist_tag%%[.+]*}"
                    if [[ ! "$dist_tag" =~ ^[A-Za-z][A-Za-z0-9-]*$ ]]; then
                      dist_tag="next"
                    fi
                    dist_tag="${dist_tag,,}"
                  fi

                  publish_tarball() {
                    local tarball="$1"
                    local metadata
                    local package_name
                    local package_version

                    metadata="$(tar -xOf "$tarball" package/package.json)"
                    package_name="$(node -e 'const p = JSON.parse(process.argv[1]); process.stdout.write(p.name)' "$metadata")"
                    package_version="$(node -e 'const p = JSON.parse(process.argv[1]); process.stdout.write(p.version)' "$metadata")"

                    if [[ "$package_version" != "$expected_version" ]]; then
                      echo "error: ${package_name} is ${package_version}, but tag is v${expected_version}" >&2
                      return 1
                    fi

                    if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
                      echo "${package_name}@${package_version} is already published"
                      return
                    fi

                    npm publish "./$tarball" --access public --tag "$dist_tag" --provenance
                  }

                  shopt -s nullglob
                  binding_tarballs=(dist/syntaxase-binding-*.tgz)
                  native_tarballs=(dist/syntaxase-[0-9]*.tgz)
                  wasm_tarballs=(dist/syntaxase-wasm-*.tgz)

                  if (( ${#binding_tarballs[@]} != 11 )); then
                    echo "error: expected 11 native binding packages, found ${#binding_tarballs[@]}" >&2
                    exit 1
                  fi
                  if (( ${#native_tarballs[@]} != 1 || ${#wasm_tarballs[@]} != 1 )); then
                    echo "error: expected one native package and one WebAssembly package" >&2
                    exit 1
                  fi

                  for tarball in "${binding_tarballs[@]}"; do
                    publish_tarball "$tarball"
                  done
                  publish_tarball "${native_tarballs[0]}"
                  publish_tarball "${wasm_tarballs[0]}"

    publish-github-release:
        name: Publish GitHub release
        needs: publish-npm
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: npm-packages
                  path: dist
            - name: Publish release assets
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                    -f tag_name="$GITHUB_REF_NAME" \
                    --jq .body > release-notes.md

                  if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                    gh release edit "$GITHUB_REF_NAME" \
                      --title "$GITHUB_REF_NAME" \
                      --notes-file release-notes.md
                    gh release upload "$GITHUB_REF_NAME" dist/*.tgz --clobber
                  else
                    gh release create "$GITHUB_REF_NAME" dist/*.tgz \
                      --verify-tag \
                      --title "$GITHUB_REF_NAME" \
                      --notes-file release-notes.md
                  fi

name: Gungraun

on:
    pull_request:
        types: [opened, reopened, synchronize]
    push:
        branches: ["**"]

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: true

jobs:
    benchmark:
        name: Compare instruction counts
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            CARGO_TARGET_DIR: ${{ runner.temp }}/gungraun-target
            GUNGRAUN_COLOR: never
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  version: 2026.8.10
            - uses: actions-rust-lang/setup-rust-toolchain@dc354b3df5a8e4db0bff5361fa176da74fcf3151 # v1
              with:
                  toolchain: 1.98.0
                  cache: false
            - name: Install Gungraun and Valgrind
              uses: gungraun/setup-gungraun@0467a72f0c206af5f965e6e70426f9230a1c067a # v1
              with:
                  runner-version: 0.19.4
            - name: Resolve comparison revisions
              id: revisions
              shell: bash
              env:
                  COMPARE_SHA: ${{ github.sha }}
                  EVENT_NAME: ${{ github.event_name }}
                  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  if [[ "$EVENT_NAME" == "pull_request" ]]; then
                    base_sha="$PR_BASE_SHA"
                    comparison_label="Merge"
                  else
                    base_sha="$(git rev-parse "${COMPARE_SHA}^")"
                    comparison_label="Commit"
                  fi

                  {
                    echo "base_sha=$base_sha"
                    echo "compare_sha=$COMPARE_SHA"
                    echo "compare_short=${COMPARE_SHA:0:12}"
                    echo "comparison_label=$comparison_label"
                  } >> "$GITHUB_OUTPUT"
            - name: Save base benchmark
              shell: bash
              env:
                  BASE_SHA: ${{ steps.revisions.outputs.base_sha }}
                  COMPARE_SHA: ${{ steps.revisions.outputs.compare_sha }}
              run: |
                  git checkout --detach "$BASE_SHA"
                  git checkout "$COMPARE_SHA" -- \
                    benchmark/corpus.mjs \
                    benchmark/build_steps.zig \
                    benchmark/prepare.mjs \
                    benchmark/native.zig \
                    benchmark/gungraun \
                    src/benchmark_root.zig \
                    src/transform/type_strip_benchmark.zig
                  node benchmark/prepare.mjs
                  zig build --fetch
                  zig build benchmark-native
                  cargo bench --quiet --locked \
                    --manifest-path benchmark/gungraun/Cargo.toml \
                    --bench type-strip -- \
                    --home="$RUNNER_TEMP/gungraun" \
                    --save-baseline=base
            - name: Compare benchmark
              shell: bash
              env:
                  BASE_SHA: ${{ steps.revisions.outputs.base_sha }}
                  COMPARE_SHA: ${{ steps.revisions.outputs.compare_sha }}
                  COMPARISON_LABEL: ${{ steps.revisions.outputs.comparison_label }}
              run: |
                  git checkout --detach "$COMPARE_SHA"
                  node benchmark/prepare.mjs
                  zig build --fetch
                  zig build benchmark-native

                  report="$RUNNER_TEMP/gungraun-report.txt"
                  summary="$RUNNER_TEMP/gungraun-summary.md"
                  set +e
                  cargo bench --quiet --locked \
                    --manifest-path benchmark/gungraun/Cargo.toml \
                    --bench type-strip -- \
                    --home="$RUNNER_TEMP/gungraun" \
                    --baseline=base \
                    --save-summary=json 2>&1 | tee "$report"
                  benchmark_status="${PIPESTATUS[0]}"
                  set -e

                  {
                    echo '## Gungraun instruction counts'
                    echo
                    echo "${COMPARISON_LABEL} \`${COMPARE_SHA:0:12}\` compared with \`${BASE_SHA:0:12}\`."
                    echo
                    echo 'Parts: 1 parse · 2 erase · 3 seal · 4 render.'
                    echo
                    echo '```text'
                    cat "$report"
                    echo '```'
                  } > "$summary"
                  cat "$summary" >> "$GITHUB_STEP_SUMMARY"

                  exit "$benchmark_status"
            - name: Prepare Valgrind artifact metadata
              id: artifact-metadata
              if: always()
              shell: bash
              env:
                  BASE_SHA: ${{ steps.revisions.outputs.base_sha }}
                  COMPARE_SHA: ${{ steps.revisions.outputs.compare_sha }}
                  COMPARE_SHORT: ${{ steps.revisions.outputs.compare_short }}
                  EVENT_NAME: ${{ github.event_name }}
                  JOB_STATUS: ${{ job.status }}
                  RUN_ATTEMPT: ${{ github.run_attempt }}
                  RUN_ID: ${{ github.run_id }}
                  RUNNER_ARCH: ${{ runner.arch }}
                  RUNNER_OS: ${{ runner.os }}
              run: |
                  if [[ "$EVENT_NAME" == "push" ]]; then
                    retention_days=30
                  else
                    retention_days=90
                  fi
                  artifact_name="gungraun-valgrind-${EVENT_NAME}-${COMPARE_SHORT}-${RUN_ID}-${RUN_ATTEMPT}"
                  metadata="$RUNNER_TEMP/gungraun-metadata.json"
                  generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                  zig_version="$(zig version 2>/dev/null || echo unavailable)"
                  rustc_version="$(rustc --version 2>/dev/null || echo unavailable)"
                  cargo_version="$(cargo --version 2>/dev/null || echo unavailable)"
                  gungraun_version="$(gungraun-runner --version 2>/dev/null || echo unavailable)"
                  valgrind_version="$(valgrind --version 2>/dev/null || echo unavailable)"

                  {
                    echo "artifact_name=$artifact_name"
                    echo "retention_days=$retention_days"
                  } >> "$GITHUB_OUTPUT"

                  jq -n \
                    --arg artifact_name "$artifact_name" \
                    --arg base_sha "$BASE_SHA" \
                    --arg cargo_version "$cargo_version" \
                    --arg compare_sha "$COMPARE_SHA" \
                    --arg event_name "$EVENT_NAME" \
                    --arg generated_at "$generated_at" \
                    --arg gungraun_version "$gungraun_version" \
                    --arg job_status "$JOB_STATUS" \
                    --arg repository "$GITHUB_REPOSITORY" \
                    --arg retention_days "$retention_days" \
                    --arg run_attempt "$RUN_ATTEMPT" \
                    --arg run_id "$RUN_ID" \
                    --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                    --arg runner_arch "$RUNNER_ARCH" \
                    --arg runner_os "$RUNNER_OS" \
                    --arg rustc_version "$rustc_version" \
                    --arg valgrind_version "$valgrind_version" \
                    --arg workflow_name "$GITHUB_WORKFLOW" \
                    --arg zig_version "$zig_version" \
                    '{
                      schema_version: 1,
                      repository: $repository,
                      workflow: {
                        name: $workflow_name,
                        event: $event_name,
                        run_id: ($run_id | tonumber),
                        run_attempt: ($run_attempt | tonumber),
                        run_url: $run_url,
                        job_status: $job_status
                      },
                      comparison: {
                        base_sha: $base_sha,
                        compare_sha: $compare_sha
                      },
                      runner: {
                        os: $runner_os,
                        arch: $runner_arch
                      },
                      tools: {
                        zig: $zig_version,
                        rustc: $rustc_version,
                        cargo: $cargo_version,
                        gungraun_runner: $gungraun_version,
                        valgrind: $valgrind_version
                      },
                      benchmark: {
                        package: "syntaxase-gungraun-benchmark",
                        bench: "type-strip",
                        baseline: "base"
                      },
                      files: {
                        data_root: "gungraun",
                        diff_report: "gungraun-report.txt",
                        rendered_summary: "gungraun-summary.md"
                      },
                      artifact: {
                        name: $artifact_name,
                        retention_days: ($retention_days | tonumber)
                      },
                      generated_at: $generated_at
                    }' > "$metadata"
            - name: Upload Valgrind analysis bundle
              id: upload-valgrind
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ${{ steps.artifact-metadata.outputs.artifact_name }}
                  path: |
                      ${{ runner.temp }}/gungraun
                      ${{ runner.temp }}/gungraun-report.txt
                      ${{ runner.temp }}/gungraun-summary.md
                      ${{ runner.temp }}/gungraun-metadata.json
                  if-no-files-found: error
                  retention-days: ${{ steps.artifact-metadata.outputs.retention_days }}
                  compression-level: 6
            - name: Link Valgrind analysis bundle
              if: always() && steps.upload-valgrind.outputs.artifact-url != ''
              shell: bash
              env:
                  ARTIFACT_URL: ${{ steps.upload-valgrind.outputs.artifact-url }}
                  RETENTION_DAYS: ${{ steps.artifact-metadata.outputs.retention_days }}
              run: |
                  {
                    echo
                    echo '### Valgrind analysis artifact'
                    echo
                    echo "[Download the raw Gungraun and Valgrind data]($ARTIFACT_URL) (retained for $RETENTION_DAYS days)."
                  } >> "$GITHUB_STEP_SUMMARY"
            - name: Update pull request comment
              if: >-
                  always() &&
                  github.event_name == 'pull_request' &&
                  github.event.pull_request.head.repo.full_name == github.repository &&
                  github.event.pull_request.user.login != 'dependabot[bot]'
              shell: bash
              env:
                  ARTIFACT_URL: ${{ steps.upload-valgrind.outputs.artifact-url }}
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  RETENTION_DAYS: ${{ steps.artifact-metadata.outputs.retention_days }}
              run: |
                  summary="$RUNNER_TEMP/gungraun-summary.md"
                  comment="$RUNNER_TEMP/gungraun-comment.md"
                  if [[ ! -s "$summary" ]]; then
                    exit 0
                  fi

                  {
                    echo '<!-- syntaxase-gungraun -->'
                    cat "$summary"
                    if [[ -n "$ARTIFACT_URL" ]]; then
                      echo
                      echo "[Download the raw Gungraun and Valgrind data]($ARTIFACT_URL) (retained for $RETENTION_DAYS days)."
                    fi
                  } > "$comment"

                  comment_id="$(
                    gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments?per_page=100" \
                      --jq '[.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | contains("<!-- syntaxase-gungraun -->")))] | first | .id // empty'
                  )"

                  if [[ -n "$comment_id" ]]; then
                    gh api --method PATCH \
                      "repos/$GH_REPO/issues/comments/$comment_id" \
                      -F "body=@$comment"
                  else
                    gh api --method POST \
                      "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
                      -F "body=@$comment"
                  fi
